<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <link rel="stylesheet" href="form.css">
</head>

<body>
    <h1>Forms</h1>
    <div class="form-container">
        <h2>Contact Form</h2>
        <p>This is for users.</p>

        <form>
            <div class="input-container">
                <label for="txtname">Name:</label>
                <input type="text" placeholder="Enter the name" id="txtname" name="username">
            </div>

            <div class="input-container">
                <label for="txtage">Age:</label>
                <input type="number" placeholder="Enter age" id="txtage" name="user_age">
            </div>

            <div class="input-container">
                <label for="txtpassword">Password:</label>
                <input type="password" placeholder="Enter the password" id="txtpassword" name="user_password">
            </div>

            <div class="input-container">
                <label for="message">Message</label>
                <textarea id="message" name="message"></textarea>
            </div>

            <button type="submit" class="btn-send">Send</button>
        </form>
    </div>
</body>
</html>
