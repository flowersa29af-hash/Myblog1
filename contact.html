<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-init">
        <div class="navigation">
            <h1>Contact</h1>
            <nav>
                <a href="home.html">Home</a>
                <a href="gallery.html">Gallery</a>
                <a href="contact.html">Contact</a>
            </nav>
            <a class="menu-sub" href="#">Submit</a>
        </div>
    </header>

    <main class="container">
        <h2 class="h2-contact">Contact</h2>
        <p>Please add your contact information in this form.</p>

        <h3>Send a message</h3>

        <form>
            <div class="input-control">
                <label>Subject</label>
                <input type="text" placeholder="Add the subject" required>
            </div>
            <div class="input-control">
                <label>Email to:</label>
                <input type="email">
            </div>
            <div class="input-control">
                <label>Sender email</label>
                <select name="Sender" id="sender-email"></select>
            </div>
        </form>
    </main>
</body>
</html>
