<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<body>
    <h1>Forms</h1>
    <div class="form-container">
        <h2>contact form</h2>
        <p>example writing</p>

        <form>
            <div class="input-container">
                <label name></label>

                <input 
                type="text"
                placeholder="enter the name"
                id="txtname"
                name="username">
            </div>

            <div class="input-container">
                <label>age:</label
                        type="number"
                        placeholder="enter age"
                        id="txtage"
                        name="user_age">

            </div>
            <div class="input-container">
                <label>password:</label>
                <input type="password"
                id="txtpassword"
                name="user_password">
            </div>
            <div class="input-container">
                <label>message</label>
                <textarea></textarea>
            </div>
            <div class="input-container">

            </div>

        </form>

    </div>
    
</body>
</html>
